[project]
name = "huffman-canonical-decoder"
version = "0.1.0"
description = "Rebuilds canonical Huffman codes from code lengths and decodes packed byte streams with no third-party dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
